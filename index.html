<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam Bros Photography</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b0b0b;
    color:white;
}

/* HERO */
.hero{
    text-align:center;
    padding:80px 20px;
    background:linear-gradient(135deg,#000,#1a1a1a);
}

.hero h1{
    font-size:42px;
    margin-bottom:10px;
}

.btn{
    padding:14px 18px;
    margin:6px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{background:white;color:black;}
.dark{background:#333;color:white;}

section{
    display:none;
    padding:30px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1c1c1c;
    padding:20px;
    border-radius:12px;
    margin-bottom:15px;
}

input,textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    border:none;
}

img{
    width:120px;
    margin:5px;
    border-radius:8px;
}

/* ADMIN PANEL */
#adminPanel{display:none;}
</style>
</head>

<body>

<!-- HOME -->
<div class="hero" id="home">
    <h1>Cam Bros Photography</h1>
    <p>Sports • Events • Moments</p>

    <button class="btn primary" onclick="openPage('gallery')">Find My Photos</button>
    <button class="btn dark" onclick="openPage('photos')">Our Photos</button>
    <button class="btn dark" onclick="openPage('events')">Upcoming Events</button>
    <button class="btn dark" onclick="openPage('book')">Book a Shoot</button>
    <button class="btn primary" onclick="openPage('admin')">Admin</button>
</div>

<!-- GALLERY -->
<section id="gallery">
<h2>Find My Photos</h2>

<div class="card">
<input id="code" placeholder="Enter Gallery Code">
<button class="btn primary" onclick="loadGallery()">Open</button>
<div id="galleryView"></div>
</div>

<button onclick="back()">Back</button>
</section>

<!-- PHOTOS -->
<section id="photos">
<h2>Our Photos</h2>
<div class="card">
<p>Portfolio coming soon (admin controls this).</p>
</div>
<button onclick="back()">Back</button>
</section>

<!-- EVENTS -->
<section id="events">
<h2>Upcoming Events</h2>
<div class="card">
<ul id="eventList"></ul>
</div>
<button onclick="back()">Back</button>
</section>

<!-- BOOK -->
<section id="book">
<h2>Book a Shoot</h2>

<div class="card">
<input id="name" placeholder="Name">
<input id="email" placeholder="Email">
<input id="phone" placeholder="Phone">
<textarea id="details" placeholder="Event details"></textarea>
<button class="btn primary" onclick="submitBooking()">Submit</button>
<p id="bookMsg"></p>
</div>

<button onclick="back()">Back</button>
</section>

<!-- ADMIN -->
<section id="admin">
<h2>Admin Panel</h2>

<div class="card" id="loginBox">
<input id="pass" type="password" placeholder="Enter Password">
<button class="btn primary" onclick="login()">Login</button>
</div>

<div class="card" id="adminPanel">
<h3>Create Gallery Code</h3>
<input id="newCode" placeholder="New Code">
<button class="btn primary" onclick="createCode()">Create</button>

<h3>Add Event</h3>
<input id="event" placeholder="Event Name">
<button class="btn primary" onclick="addEvent()">Add</button>

<h3>Change Password</h3>
<input id="newPass" placeholder="New Password">
<button class="btn primary" onclick="changePass()">Save</button>

</div>

<button onclick="back()">Back</button>
</section>

<script>

let events = [];

/* NAV */
function openPage(id){
    document.getElementById("home").style.display="none";
    document.querySelectorAll("section").forEach(s=>s.style.display="none");
    document.getElementById(id).style.display="block";
}

function back(){
    document.querySelectorAll("section").forEach(s=>s.style.display="none");
    document.getElementById("home").style.display="block";
}

/* BOOKING */
function submitBooking(){
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;

    if(!name || !email || !phone){
        alert("Fill all fields");
        return;
    }

    document.getElementById("bookMsg").innerText =
    "Booking submitted. We will contact you.";
}

/* GALLERY */
function loadGallery(){
    const code = document.getElementById("code").value;
    const data = JSON.parse(localStorage.getItem(code));

    const view = document.getElementById("galleryView");
    view.innerHTML="";

    if(!data){
        view.innerHTML="No gallery found";
        return;
    }

    data.forEach(img=>{
        let i = document.createElement("img");
        i.src = img;
        view.appendChild(i);
    });
}

/* ADMIN LOGIN */
function login(){
    const pass = document.getElementById("pass").value;
    const saved = localStorage.getItem("adminPass") || "Cambros2025";

    if(pass === saved){
        document.getElementById("loginBox").style.display="none";
        document.getElementById("adminPanel").style.display="block";
    } else {
        alert("Wrong password");
    }
}

/* CREATE GALLERY */
function createCode(){
    const code = document.getElementById("newCode").value;
    localStorage.setItem(code, JSON.stringify([]));
    alert("Gallery created: " + code);
}

/* EVENTS */
function addEvent(){
    const e = document.getElementById("event").value;
    events.push(e);

    document.getElementById("eventList").innerHTML =
    events.map(x=>"<li>"+x+"</li>").join("");
}

/* PASSWORD CHANGE */
function changePass(){
    const newPass = document.getElementById("newPass").value;
    localStorage.setItem("adminPass", newPass);
    alert("Password updated");
}

</script>

</body>
</html>

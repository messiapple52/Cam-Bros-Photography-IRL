<!DOCTYPE html>
<html>
<head>
<title>Cam Bros Photography</title>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:40px 20px;
}

button{
  padding:12px 16px;
  margin:6px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.primary{background:white;color:black;}
.dark{background:#333;color:white;}

section{
  display:none;
  padding:20px;
}

.card{
  background:#1c1c1c;
  padding:20px;
  margin:20px auto;
  max-width:500px;
  border-radius:10px;
}

input{
  width:90%;
  padding:10px;
  margin:6px;
  border-radius:8px;
  border:none;
}

img{
  width:120px;
  margin:5px;
  border-radius:8px;
}
</style>
</head>

<body>

<header>
  <h1>Cam Bros Photography</h1>

  <button class="primary" onclick="show('gallery')">Find My Photos</button>
  <button class="dark" onclick="show('book')">Book</button>
  <button class="dark" onclick="show('admin')">Admin</button>
</header>

<!-- GALLERY -->
<section id="gallery">
  <h2>Find My Photos</h2>

  <div class="card">
    <input id="code" placeholder="Enter Code">
    <button class="primary" onclick="loadGallery()">Open</button>
    <div id="photos"></div>
  </div>

  <button onclick="back()">Back</button>
</section>

<!-- BOOKING -->
<section id="book">
  <h2>Book a Shoot</h2>

  <div class="card">
    <input id="bname" placeholder="Name">
    <input id="bemail" placeholder="Email">
    <input id="bphone" placeholder="Phone">
    <button class="primary" onclick="book()">Submit</button>
  </div>

  <button onclick="back()">Back</button>
</section>

<!-- ADMIN -->
<section id="admin">
  <h2>Admin Panel</h2>

  <div class="card" id="loginBox">
    <input id="pass" type="password" placeholder="Password">
    <button class="primary" onclick="login()">Login</button>
  </div>

  <div class="card" id="panel" style="display:none">

    <h3>Create Gallery Code</h3>
    <input id="newCode" placeholder="Code">
    <button class="primary" onclick="createCode()">Create</button>

    <h3>Upload Photo</h3>
    <input id="file" type="file">
    <input id="galleryCode" placeholder="Gallery Code">
    <button class="primary" onclick="upload()">Upload</button>

    <h3>Events</h3>
    <input id="event" placeholder="Event Name">
    <button class="primary" onclick="addEvent()">Add</button>

    <div id="eventList"></div>

  </div>

  <button onclick="back()">Back</button>
</section>

<script>

/* 🔑 SUPABASE CONNECT */
const supabaseUrl = "https://rldroutcofersmaxvlkq.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhueHB2eWtlenVpZ2Roa212ZHZrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjMxMzYsImV4cCI6MjA5MzQzOTEzNn0.hVluf7TVg719lkrLbRpgeenv698dDZTzaIH7o4hQt64";

const supabase = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);

/* NAV */
function show(id){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

function back(){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
}

/* LOGIN */
function login(){
  if(document.getElementById("pass").value === "CamBros2026"){
    document.getElementById("loginBox").style.display="none";
    document.getElementById("panel").style.display="block";
  } else {
    alert("Wrong password");
  }
}

/* CREATE GALLERY CODE */
async function createCode(){
  const code = document.getElementById("newCode").value;

  await supabase.from("galleries").insert([{ code }]);

  alert("Gallery created: " + code);
}

/* UPLOAD PHOTO */
async function upload(){
  const file = document.getElementById("file").files[0];
  const code = document.getElementById("galleryCode").value;

  if(!file || !code){
    alert("Missing file or code");
    return;
  }

  const fileName = Date.now() + file.name;

  // upload to storage
  const { data, error } = await supabase
    .storage
    .from("galleries")
    .upload(fileName, file);

  if(error){
    alert("Upload failed");
    return;
  }

  const url = supabase.storage
    .from("galleries")
    .getPublicUrl(fileName).data.publicUrl;

  // save to database
  await supabase.from("photos").insert([{
    gallery_code: code,
    url: url
  }]);

  alert("Photo uploaded");
}

/* LOAD GALLERY */
async function loadGallery(){
  const code = document.getElementById("code").value;

  const { data } = await supabase
    .from("photos")
    .select("*")
    .eq("gallery_code", code);

  const box = document.getElementById("photos");
  box.innerHTML = "";

  if(!data || data.length === 0){
    box.innerHTML = "No photos found";
    return;
  }

  data.forEach(p=>{
    let img = document.createElement("img");
    img.src = p.url;
    box.appendChild(img);
  });
}

/* EVENTS */
let events = [];

function addEvent(){
  const e = document.getElementById("event").value;
  events.push(e);

  document.getElementById("eventList").innerHTML =
    events.map(x=>"📅 "+x).join("<br>");
}

/* BOOKING */
function book(){
  alert("Booking sent (we will contact you)");
}

</script>

</body>
</html>

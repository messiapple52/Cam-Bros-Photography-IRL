<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cam Bros Photography</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
}

.hero{
    text-align:center;
    padding:80px 20px;
}

button{
    padding:15px 25px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:white;
    color:black;
}

.dark{
    background:#333;
    color:white;
}

.page{
    display:none;
    padding:30px;
    max-width:900px;
    margin:auto;
}

.card{
    background:#1e1e1e;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}
</style>
</head>

<body>

<div id="home" class="hero">
    <h1>Cam Bros Photography</h1>
    <p>Sports • Events • Photography</p>

    <button class="primary" onclick="showPage('photos')">Our Photos</button>
    <button class="dark" onclick="showPage('events')">Upcoming Events</button>
    <button class="dark" onclick="showPage('find')">Find My Photos</button>
    <button class="dark" onclick="showPage('book')">Book a Shoot</button>
    <button class="primary" onclick="showPage('admin')">Admin</button>
</div>

<div id="photos" class="page">
    <div class="card">
        <h2>Our Photos</h2>
        <p>Add your showcase photos here later.</p>
    </div>
    <button onclick="goHome()">Back</button>
</div>

<div id="events" class="page">
    <div class="card">
        <h2>Upcoming Events</h2>
        <p>No events added yet.</p>
    </div>
    <button onclick="goHome()">Back</button>
</div>

<div id="find" class="page">
    <div class="card">
        <h2>Find My Photos</h2>
        <input placeholder="Enter Code">
    </div>
    <button onclick="goHome()">Back</button>
</div>

<div id="book" class="page">
    <div class="card">
        <h2>Book a Shoot</h2>
        <input placeholder="Name"><br><br>
        <input placeholder="Email"><br><br>
        <input placeholder="Phone"><br><br>
        <button>Submit</button>
    </div>
    <button onclick="goHome()">Back</button>
</div>

<div id="admin" class="page">
    <div class="card">
        <h2>Admin</h2>
        <input type="password" placeholder="Password"><br><br>
        <button>Login</button>
    </div>
    <button onclick="goHome()">Back</button>
</div>

<script>
function showPage(id){
    document.getElementById("home").style.display="none";

    document.querySelectorAll(".page").forEach(page=>{
        page.style.display="none";
    });

    document.getElementById(id).style.display="block";
}

function goHome(){
    document.querySelectorAll(".page").forEach(page=>{
        page.style.display="none";
    });

    document.getElementById("home").style.display="block";
}
</script>

</body>
</html>

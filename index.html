<!DOCTYPE html>
<html>
<head>
<title>Cam Bros Photography</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#0f0f0f;
  color:white;
  text-align:center;
}

header{
  padding:60px 20px;
}

button{
  padding:15px;
  margin:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

.btn{
  background:white;
  color:black;
}

.dark{
  background:#333;
  color:white;
}

section{
  display:none;
  padding:40px;
}

.card{
  background:#1c1c1c;
  padding:20px;
  margin:20px auto;
  max-width:500px;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
<h1>Cam Bros Photography</h1>
<p>Sports • Events • Moments</p>

<button class="btn" onclick="show('find')">Find My Photos</button>
<button class="dark" onclick="show('book')">Book a Shoot</button>
<button class="dark" onclick="show('admin')">Admin</button>
</header>

<section id="find">
<h2>Find My Photos</h2>
<div class="card">
<input placeholder="Enter Code">
<br><br>
<button class="btn">Open</button>
</div>
<button onclick="back()">Back</button>
</section>

<section id="book">
<h2>Book a Shoot</h2>
<div class="card">
<input placeholder="Name">
<input placeholder="Email">
<input placeholder="Phone">
<br><br>
<button class="btn">Submit</button>
</div>
<button onclick="back()">Back</button>
</section>

<section id="admin">
<h2>Admin</h2>
<div class="card">
<input type="password" placeholder="Password">
<br><br>
<button class="btn">Login</button>
</div>
<button onclick="back()">Back</button>
</section>

<script>
function show(id){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
  document.getElementById(id).style.display="block";
}

function back(){
  document.querySelectorAll("section").forEach(s=>s.style.display="none");
}
</script>

</body>
</html>
